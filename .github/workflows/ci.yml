name: ci

on:
  push:
  pull_request:
  schedule:
    # weekly: catch breaking changes in new pi releases early
    - cron: "0 9 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pi: [pinned, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - if: matrix.pi == 'latest'
        run: npm install --no-save --no-audit --no-fund @earendil-works/pi-coding-agent@latest
      - run: npm test
